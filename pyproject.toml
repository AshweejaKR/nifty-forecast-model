[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-forecast-model"
version = "0.1.0"
description = "Small NIFTY 50 forecasting models built for learning"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "torch",
    "xgboost",
]

[tool.setuptools.packages.find]
where = ["src"]
